name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        default: main

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Defining SOURCE_DATE_EPOCH makes ggml (whisper.cpp, pulled in via scribble ->
  # whisper-rs) default GGML_NATIVE=OFF, so it builds a portable CPU baseline
  # instead of auto-detecting the build host's features. Required on the Apple
  # Silicon runners: native detection mis-enables the ARMv8.6 i8mm intrinsics and
  # the CPU backend fails to compile ("vmmlaq_s32 ... requires target feature
  # 'i8mm'"). It also keeps shipped binaries from assuming SIMD features that
  # users' machines may lack. whisper-rs-sys only forwards WHISPER_*/CMAKE_* env
  # vars to CMake, so this is the only knob that reaches GGML_NATIVE. Value just
  # needs to be a valid post-1980 epoch (2024-01-01 here).
  SOURCE_DATE_EPOCH: "1704067200"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

  build:
    name: Build (${{ matrix.platform }}${{ matrix.args && format(' {0}', matrix.args) || '' }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            # GPU comes from the scribble `metal` feature (see src-tauri/Cargo.toml).
            # No x86 SIMD knobs here: the universal bundle also builds an aarch64
            # slice where they don't apply. Apple Silicon uses NEON (always on) +
            # Metal; Intel Macs fall back to Metal.
          - platform: ubuntu-22.04
            args: ''
            # SOURCE_DATE_EPOCH forces GGML_NATIVE=OFF (portable build), which also
            # drops AVX2/FMA/F16C. Re-enable a universal desktop CPU baseline via
            # ggml's own options (whisper-rs-sys forwards GGML_* to CMake). Using
            # these instead of CMAKE_C_FLAGS keeps ggml's ARCH_FLAGS separate from
            # the crate's -fPIC in CMAKE_C_FLAGS — overriding that flag drops -fPIC
            # and breaks the shared-lib link. ggml adds -mavx2/-mfma/-mf16c itself.
            ggml_avx2: 'ON'
            ggml_fma: 'ON'
            ggml_f16c: 'ON'
          - platform: windows-latest
            # --features gpu-vulkan builds whisper.cpp's Vulkan backend so
            # transcription runs on the GPU (any vendor), falling back to CPU when
            # no device is present. Requires the Vulkan SDK, installed below.
            # Folding it into args also busts the Rust cache for this build.
            args: '--features gpu-vulkan'
            # Same portable AVX2 baseline via ggml options. On MSVC, GGML_AVX2=ON
            # emits /arch:AVX2 and implies FMA/F16C (ggml-cpu-impl.h); the extra
            # FMA/F16C flags are harmless no-ops there. Going through GGML_* also
            # avoids overriding CMAKE_CXX_FLAGS and dropping the crate's /utf-8.
            ggml_avx2: 'ON'
            ggml_fma: 'ON'
            ggml_f16c: 'ON'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # NOTE: whisper-rs-sys does not declare rerun-if-env-changed for the GGML_*
          # SIMD flags, so changing them does NOT invalidate this cache. On the rare
          # occasion you change those flags, manually clear the Actions cache (or bump
          # this key), or a stale whisper.cpp will be restored.
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # whisper-rs-sys links vulkan-1 and compiles GGML's Vulkan shaders (glslc)
      # at build time when the vulkan feature is on, and panics without VULKAN_SDK.
      # Install the latest LunarG SDK and export VULKAN_SDK + its Bin (glslc) dir.
      # Also switch the CMake build to Ninja: ggml-vulkan's nested shader-gen
      # sub-build overflows Windows' 260-char MAX_PATH under MSBuild's FileTracker
      # (FTK1011, which ignores LongPathsEnabled). Ninja doesn't create those deep
      # .tlog files, so the build stays under the limit.
      - name: Install Vulkan SDK + Ninja (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The npm `rc` package installs a node_modules/.bin/rc shim that yarn puts
          # on PATH ahead of the Windows SDK's resource compiler. Under Ninja, CMake's
          # vs_link_exe resolves `rc` from PATH, grabs the shim, and linking fails.
          # Remove the shim and pin the real rc.exe (also prepend its dir to PATH so
          # the vulkan-shaders-gen sub-build finds it too).
          Remove-Item -Force "node_modules\.bin\rc","node_modules\.bin\rc.cmd","node_modules\.bin\rc.ps1","node_modules\.bin\rc.bat" -ErrorAction SilentlyContinue
          $rc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($rc) {
            "CMAKE_RC_COMPILER=$($rc.FullName -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            (Split-Path $rc.FullName) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          curl.exe -L --fail --retry 3 -o $installer "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK install dir not found under C:\VulkanSDK" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Installed Vulkan SDK at $sdk"

      # Ninja needs cl/link on PATH (unlike the VS generator, which finds the
      # toolchain itself). Activate the MSVC dev environment for the build step.
      - name: Set up MSVC environment (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # The repo permanently carries version 0.0.0 (dev marker); releases get
      # their real version from the tag. workflow_dispatch test builds keep
      # 0.0.0 so they're identifiable as non-releases.
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/set-version.mjs "${TAG#v}"

      - name: Require macOS signing secrets for releases
        if: matrix.platform == 'macos-latest' && github.event_name == 'release'
        env:
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          missing=()
          for secret in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing macOS release secrets: ${missing[*]}"
            echo "::error::Use a Developer ID Application certificate and an Apple app-specific password for notarization."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # Per-platform CPU SIMD baseline for whisper.cpp/ggml (see matrix).
          # whisper-rs-sys forwards GGML_*-prefixed env vars to CMake. Empty on
          # macOS (evaluates to "" → treated as OFF), where the universal build
          # deliberately sets no x86 SIMD options.
          GGML_AVX2: ${{ matrix.ggml_avx2 }}
          GGML_FMA: ${{ matrix.ggml_fma }}
          GGML_F16C: ${{ matrix.ggml_f16c }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Desktop releases use a Developer ID Application certificate, which is
          # distinct from the Apple Distribution certificate used by the iOS job.
          APPLE_CERTIFICATE: ${{ github.event_name == 'release' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'release' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name == 'release' && secrets.MACOS_NOTARIZATION_APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'release' && secrets.MACOS_NOTARIZATION_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && 'P4Z946QP26' || '' }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.MACOS_NOTARIZATION_PROVIDER_SHORT_NAME }}
          # Source maps for posthog-js exception symbolication. yarn build (run
          # by tauri-action) injects chunk IDs and uploads the maps via
          # scripts/posthog-sourcemaps.mjs. The key is only set on release
          # events, so workflow_dispatch test builds skip the upload.
          POSTHOG_CLI_API_KEY: ${{ github.event_name == 'release' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
          VITE_GITHUB_CLIENT_SECRET: ${{ secrets.VITE_GITHUB_CLIENT_SECRET }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

  android:
    name: Build (android)
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VITE_TABLET_LAYOUT: "true"
      VITE_GITHUB_CLIENT_SECRET: ${{ secrets.VITE_GITHUB_CLIENT_SECRET }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}'

      # The runner image preinstalls its own (newer) NDK under $ANDROID_HOME/ndk,
      # and cargo-mobile's NDK resolver otherwise picks the highest version it
      # finds there rather than our pinned one — so the linker/sysroot silently
      # drift to whatever the image ships. Export the standard NDK env vars (which
      # the resolver prioritizes over the version scan) so every step below uses
      # the pinned NDK_VERSION deterministically.
      - name: Pin NDK
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_PATH" || { echo "::error::pinned NDK not found at $NDK_PATH"; exit 1; }
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME NDK_HOME; do
            echo "$v=$NDK_PATH" >> "$GITHUB_ENV"
          done

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: android

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Releases get their version from the tag. Unlike desktop, dispatch test
      # builds can't keep the repo's 0.0.0 dev version: `tauri android build`
      # rejects the derived versionCode 0, so they stamp 0.0.1 instead.
      - name: Set version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            node scripts/set-version.mjs "${TAG#v}"
          else
            node scripts/set-version.mjs 0.0.1
          fi

      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            yarn tauri android init
          fi

      - name: Require signing secrets for releases
        if: github.event_name == 'release' && env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is unset; refusing to publish unsigned Android artifacts"
          exit 1

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # The Rust cache above restores the target dir, which includes whisper-rs-sys's
      # CMake build dir (out/build/CMakeCache.txt). On a restore-key (partial) cache
      # hit -- e.g. whenever Cargo.lock changed -- cargo re-runs whisper-rs-sys's build
      # script and the `cmake` crate RE-configures that restored build dir. Because
      # whisper.cpp pins cmake_minimum_required(3.5) (CMP0126 = OLD), re-configuring an
      # existing Android build tree makes CMake declare CMAKE_C_COMPILER "changed",
      # print "you have changed variables that require your cache to be deleted", wipe
      # the cache and re-configure -- and the wipe drops the crate's command-line
      # -DWHISPER_BUILD_EXAMPLES=OFF / -DWHISPER_BUILD_TESTS=OFF. whisper.cpp then falls
      # back to its WHISPER_STANDALONE=ON default and runs add_subdirectory(examples)/
      # (tests) on dirs the packaged crate doesn't ship, failing with
      # "add_subdirectory given source \"examples\" which is not an existing directory".
      # (Confirmed locally: a fresh configure works; re-configuring the same dir resets.)
      # The last green run had a cold cache; every failure since has been a warm one.
      # cargo clean -p doesn't remove the per-target build-script dirs, so purge the
      # whisper-rs-sys build + fingerprint dirs directly to force a clean reconfigure.
      # The rest of the workspace stays cached.
      - name: Purge cached whisper-rs-sys build (avoid stale CMake cache reset)
        run: |
          find src-tauri/target -type d -name 'whisper-rs-sys-*' -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Purged whisper-rs-sys build + fingerprint dirs"

      - name: Build Android
        env:
          # Play rejects targetSdk 35+ apps whose 64-bit native libs have 4 KB
          # page alignment, and the pinned NDK 26 still links that way (r27+
          # made 16 KB the default -- drop this when NDK_VERSION moves up).
          # Every native lib we ship -- whisper.cpp/ggml, candle, iroh -- links
          # into the Rust cdylib, so setting it on the Rust link covers all of
          # them. Passed as CARGO_ENCODED_RUSTFLAGS, not RUSTFLAGS, because the
          # CLI hands gradle a whitelisted env (see the ios job) that keeps
          # CARGO_* but not a bare RUSTFLAGS.
          CARGO_ENCODED_RUSTFLAGS: -Clink-arg=-Wl,-z,max-page-size=16384
          # whisper-rs-sys runs bindgen against the Android target. bindgen sets
          # the correct --target per ABI from cargo's TARGET, but without the NDK
          # sysroot clang falls back to the host /usr/include, can't find libc
          # headers, and the crate silently uses its bundled 64-bit bindings.rs.
          # Those hardcode 64-bit struct sizes, so the 32-bit ABIs (armv7, i686)
          # fail the compile-time size assertions (E0080 overflow). Pointing
          # bindgen at the sysroot lets it generate correct per-ABI bindings.
          BINDGEN_EXTRA_CLANG_ARGS: --sysroot=${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: yarn tauri android build --apk --aab

      # The alignment above rides on an env var through two process hops
      # (CLI -> gradle -> CLI -> cargo), and a dropped var fails silently: the
      # build succeeds and only the Play upload rejects it. Check the shipped
      # 64-bit libs directly. 32-bit ABIs are exempt from the requirement.
      - name: Verify 16 KB page alignment
        run: |
          OBJDUMP="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          rm -rf /tmp/align-check && mkdir -p /tmp/align-check
          for apk in src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            unzip -oq "$apk" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d /tmp/align-check
          done
          checked=0
          for so in $(find /tmp/align-check -name '*.so'); do
            checked=$((checked + 1))
            if "$OBJDUMP" -p "$so" | awk '$1 == "LOAD" { print $NF }' | grep -qv '2\*\*1[4-9]'; then
              echo "::error::$(basename "$so") has LOAD segments below 16 KB alignment"
              "$OBJDUMP" -p "$so" | awk '$1 == "LOAD"'
              exit 1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no 64-bit libraries found to check"
            exit 1
          fi
          echo "$checked library(s) are 16 KB aligned"

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Match the real output depth. `**` without globstar is just `*`, so
          # the two-deep APK path (apk/<flavor>/release/) never matched and
          # 0.2.4 shipped the AAB alone -- the AAB path is one level shallower
          # and matched by accident.
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk src-tauri/gen/android/app/build/outputs/bundle/*/*.aab)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no APK or AAB found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  ios:
    name: Build (ios)
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      VITE_TABLET_LAYOUT: "true"
      VITE_GITHUB_CLIENT_SECRET: ${{ secrets.VITE_GITHUB_CLIENT_SECRET }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ios

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same tag-derived version as the other jobs, minus any prerelease
      # suffix: Apple's version format is numeric-only and the Tauri CLI
      # panics on prerelease semvers in iOS builds (tauri#12470).
      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          node scripts/set-version.mjs "${VERSION%%-*}"

      - name: Init iOS project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            yarn tauri ios init
          fi

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Configure App Store signing
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_PROVISIONING_PROFILE != ''
        run: |
          PBXPROJ=src-tauri/gen/apple/myelin.xcodeproj/project.pbxproj
          EXPORT_OPTIONS=src-tauri/gen/apple/ExportOptions.plist
          perl -0pi -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Myelin Notes app store distribution profile";/g' "$PBXPROJ"
          PATCHED=$(grep -c 'CODE_SIGN_IDENTITY = "Apple Distribution";' "$PBXPROJ" || true)
          if [ "$PATCHED" -eq 0 ]; then
            echo "::error::failed to configure App Store signing in $PBXPROJ"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :teamID string P4Z946QP26' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:com.github.wintersteve25.myelin string Myelin Notes app store distribution profile' "$EXPORT_OPTIONS"
          plutil -lint "$EXPORT_OPTIONS"
          echo "Configured App Store signing in $PATCHED pbxproj build configuration(s)"

      - name: Build iOS
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_BUNDLE_VERSION: "${{ github.run_number }}.${{ github.run_attempt }}"
        run: |
          CONFIG="{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$IOS_BUNDLE_VERSION\"}}}"
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            yarn tauri ios build --config "$CONFIG" --export-method app-store-connect
          else
            yarn tauri ios build --config "$CONFIG" --export-method debugging
          fi

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/gen/apple/build/arm64/*.ipa)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no IPA found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
